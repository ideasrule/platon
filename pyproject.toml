[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "platon"
dynamic = ["version"]
description = "A package to compute transmission spectra and retrieve atmospheric parameters from transmission spectra"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Michael Zhang", email = "zmzhang@caltech.edu" },
    { name = "Yayaati Chachan" },
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0",
    "scipy",
    "jax>=0.5.0",
    "emcee",
    "dynesty",
    "corner",
    "future",
    "nose",
    "setuptools",
    "configparser",
    "matplotlib",
]

[project.optional-dependencies]
nautilus = ["nautilus-sampler"]

[project.urls]
Homepage = "https://github.com/ideasrule/platon"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
# Read as a literal from the source file, so the build never imports the
# package (which would pull in JAX inside pip's isolated build environment).
version = { attr = "platon.__version__" }

[tool.setuptools.packages.find]
include = ["platon", "platon.*"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "platon"
dynamic = ["version"]
description = "A package to compute transmission spectra and retrieve atmospheric parameters from transmission spectra"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Michael Zhang", email = "zmzhang@uchicago.edu" },
    { name = "Yayaati Chachan" },
    { name = "Tyler Fairnington" }
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0",
    "scipy",
    "jax[cuda12]",
    "emcee",
    "dynesty",
    "corner",
    "matplotlib",
    "pandas",
    "astropy",
    "nautilus",
    "pytest"
]

[project.urls]
Homepage = "https://github.com/ideasrule/platon"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
# Read as a literal from the source file, so the build never imports the
# package (which would pull in JAX inside pip's isolated build environment).
version = { attr = "platon.__version__" }

[tool.setuptools.packages.find]
include = ["platon", "platon.*"]
